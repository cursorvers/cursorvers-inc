<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursorvers Hero S4 — Electric Vital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   S4 電撃バイタル — Electric Vital
   巨大オシロスコープの中。心電図が光の雷として画面を走る。
   canvas 全滅時も DOM テキストは base CSS で常に可視 (failsafe)。
   ============================================================ */
:root{
  --deep:#101D33; --ink:#13243F;
  --azure:#3E6FA8; --azure-soft:#7FA3CC; --azure-deep:#36618F;
  --gold:#C8922E; --ivory:#F4F1EA; --card:#FBFAF5;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--deep)}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ivory);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

.hero{
  position:relative;min-height:100svh;overflow:hidden;
  background:radial-gradient(130% 95% at 50% 18%, var(--ink) 0%, var(--deep) 58%, #0B1526 100%);
}

/* --- オシロ画面の走査線グリッド (CSS のみ、canvas 非依存) --- */
.grid{
  position:absolute;inset:-28px;z-index:0;pointer-events:none;will-change:transform;
  background-image:
    repeating-linear-gradient(0deg,  rgba(127,163,204,.055) 0 1px, transparent 1px 72px),
    repeating-linear-gradient(90deg, rgba(127,163,204,.055) 0 1px, transparent 1px 72px),
    repeating-linear-gradient(0deg,  rgba(127,163,204,.022) 0 1px, transparent 1px 18px),
    repeating-linear-gradient(90deg, rgba(127,163,204,.022) 0 1px, transparent 1px 18px);
}

/* --- 奥の巨大ウォーターマーク (canvas の光に洗われる) --- */
.watermark{
  position:absolute;left:50%;bottom:4.5%;transform:translateX(-50%);z-index:0;
  font-family:Manrope,sans-serif;font-weight:800;line-height:1;white-space:nowrap;
  font-size:clamp(64px,14.5vw,215px);letter-spacing:.05em;
  pointer-events:none;user-select:none;
  color:rgba(127,163,204,.04);-webkit-text-stroke:1px rgba(127,163,204,.07);
}

#fx{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block}
html.anim #fx{animation:fxIn 1.1s ease both}
@keyframes fxIn{from{opacity:0}to{opacity:1}}

/* --- CRT スキャンライン + ビネット (canvas の上、文字の下) --- */
.scan{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(9,16,30,.16) 0 1px, transparent 1px 3px),
    radial-gradient(120% 105% at 50% 42%, transparent 52%, rgba(9,16,30,.62) 100%);
}

/* --- ベゼル HUD (文字なし、純グラフィック) --- */
.hud{
  position:absolute;inset:clamp(12px,2vw,26px);z-index:2;pointer-events:none;
  border:1px solid rgba(127,163,204,.09);
}
.hud::before,.hud::after{content:"";position:absolute;width:26px;height:26px}
.hud::before{top:-1px;left:-1px;border-top:2px solid rgba(200,146,46,.5);border-left:2px solid rgba(200,146,46,.5)}
.hud::after{bottom:-1px;right:-1px;border-bottom:2px solid rgba(200,146,46,.5);border-right:2px solid rgba(200,146,46,.5)}

/* --- コンテンツ --- */
.content{
  position:relative;z-index:3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100svh;text-align:center;
  padding:0 clamp(20px,5vw,80px) 13vh;
}
/* 文字の背後にだけ薄い暗幕 — 光が文字を潰さない保険 */
.content::before{
  content:"";position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
  width:min(94vw,1080px);height:min(58vh,520px);z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side, rgba(10,18,33,.66), rgba(10,18,33,0) 72%);
}

.kicker{
  display:flex;align-items:center;gap:clamp(8px,1.6vw,16px);white-space:nowrap;
  font-family:Manrope,sans-serif;font-weight:600;
  font-size:clamp(9px,1vw,12px);letter-spacing:.42em;text-transform:uppercase;
  color:rgba(127,163,204,.9);
}
.rule{display:inline-block;width:clamp(18px,3vw,40px);height:1px;background:rgba(127,163,204,.45)}
.rule.gold{background:rgba(200,146,46,.65)}

#title{margin-top:clamp(18px,3.2vh,30px)}
.line{display:block}
.line.main{
  font-family:"Noto Serif JP",serif;font-weight:900;
  font-size:clamp(2.3rem,8.4vw,6rem);line-height:1.16;letter-spacing:.04em;
  color:var(--ivory);
}
.line.main .tok{
  text-shadow:0 0 18px rgba(127,163,204,.6), 0 0 56px rgba(62,111,168,.42), 0 2px 30px rgba(9,16,30,.95);
}
.line.sub{
  margin-top:clamp(14px,2.4vh,24px);
  font-family:"Noto Sans JP",sans-serif;font-weight:500;
  font-size:clamp(.95rem,2vw,1.4rem);letter-spacing:.16em;
  color:rgba(244,241,234,.88);
}
.line.sub .tok{text-shadow:0 0 14px rgba(127,163,204,.35), 0 2px 18px rgba(9,16,30,.9)}
.tok{display:inline-block;white-space:nowrap}

.badge{
  margin-top:clamp(20px,3.6vh,34px);
  font-family:"Noto Sans JP",sans-serif;font-weight:500;
  font-size:clamp(10px,1.1vw,12.5px);letter-spacing:.3em;text-indent:.3em;
  color:rgba(200,146,46,.95);
  border:1px solid rgba(200,146,46,.38);border-radius:999px;
  padding:10px 20px;background:rgba(16,29,51,.42);
  box-shadow:0 0 24px rgba(200,146,46,.12), inset 0 0 12px rgba(200,146,46,.05);
}

.tag{
  position:absolute;right:16px;bottom:13px;z-index:4;pointer-events:none;
  font-family:Manrope,sans-serif;font-weight:600;font-size:10px;
  letter-spacing:.32em;text-transform:uppercase;color:rgba(244,241,234,.4);
}

/* --- 点灯演出 (JS が html.anim を付けた時だけ暗転から始まる) --- */
html.anim .tok:not(.lit){opacity:.05;text-shadow:none}
html.anim .kicker{opacity:0;animation:kickIn 1.1s .35s cubic-bezier(.22,.68,.32,1) forwards}
html.anim .badge{opacity:0;transform:translateY(8px);transition:opacity .8s ease,transform .8s ease}
html.anim .badge.lit{opacity:1;transform:none}
.tok.lit{opacity:1;animation:ignite .62s cubic-bezier(.25,.6,.3,1) both}
#title.pulse .tok{animation:beatPulse .5s ease-out}

@keyframes kickIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes ignite{
  0%{opacity:.05;transform:translateX(-7px) skewX(-7deg);filter:brightness(.4)}
  7%{opacity:1;filter:brightness(2.8)}
  12%{opacity:.15;filter:brightness(1)}
  18%{opacity:1;transform:translateX(3px) skewX(4deg);filter:brightness(2.1)}
  25%{opacity:.4}
  33%{opacity:1;transform:none;filter:brightness(1.6)}
  100%{opacity:1;transform:none;filter:brightness(1)}
}
@keyframes beatPulse{0%{filter:brightness(1.85)}100%{filter:brightness(1)}}

@media (max-width:480px){
  .kicker{letter-spacing:.26em;font-size:9px}
  .content{padding-bottom:10vh}
}

/* reduced-motion: JS 側で静止代表フレームを描く。CSS 動作も全停止。 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  html.anim .tok:not(.lit){opacity:1}
}
</style>
</head>
<body>
<section class="hero" id="hero">
  <div class="grid" id="grid" aria-hidden="true"></div>
  <div class="watermark" aria-hidden="true">CURSORVERS</div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="scan" aria-hidden="true"></div>
  <div class="hud" aria-hidden="true"></div>

  <div class="content">
    <p class="kicker"><span class="rule"></span><span>CURSORVERS</span><span class="rule gold"></span><span>MEDICAL AI REVIEW</span><span class="rule"></span></p>
    <h1 id="title" aria-label="AIに、臨床の魂を 医療AIを、現場に届く言葉へ">
      <span class="line main" aria-hidden="true"><span class="tok">AIに、</span><span class="tok">臨床の</span><span class="tok">魂を</span></span>
      <span class="line sub" aria-hidden="true"><span class="tok">医療AIを、</span><span class="tok">現場に届く</span><span class="tok">言葉へ</span></span>
    </h1>
    <p class="badge">医療AIの第三者レビュー</p>
  </div>

  <div class="tag" aria-hidden="true">S4 · Electric Vital</div>
</section>

<script>
(function(){
'use strict';
/* ==========================================================
   Electric Vital engine — vanilla JS + canvas 2D
   トレースは毎フレーム解析的に再描画 (蓄積 canvas なし):
   蛍光体残光 = exp 減衰を輝度バケットに量子化した一括ストローク。
   ghosting ゼロ / resize 安全 / ?static=1 は同式で同期一発描画。
   ========================================================== */
var DOC=document, ROOT=DOC.documentElement;
var qsp=new URLSearchParams(location.search);
var STATIC_PARAM=qsp.get('static')==='1';
var REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var STATIC_MODE=STATIC_PARAM||REDUCED;

var hero=DOC.getElementById('hero');
var canvas=DOC.getElementById('fx');
var grid=DOC.getElementById('grid');
var title=DOC.getElementById('title');
var badge=DOC.querySelector('.badge');
var mainToks=[].slice.call(DOC.querySelectorAll('.line.main .tok'));
var subToks=[].slice.call(DOC.querySelectorAll('.line.sub .tok'));
var ctx=canvas.getContext('2d');
if(!ctx){ ROOT.classList.add('lit-all'); return; } /* canvas 全滅 → base CSS の可視文字のみで成立 */

/* ---------- 定数 ---------- */
var SWEEP=2.35;          /* ビーム掃引周期 (s)。心拍 2.8s と非整数比 → スパイク位置が毎拍ドリフト */
var PERIOD=2.8;          /* 心拍周期 (s) */
var R_T=0.055;           /* 拍起点から R 波頂点までのオフセット (s) */
var AMP=0.40;            /* R スパイク = 画面高の 40% */
var K_DECAY=0.85;        /* 蛍光体残光の減衰率 (1/s) → 数秒かけて消える */
var NB=24;               /* 残光輝度バケット数 (ストローク数を 3パス×24 に束ねる) */
var INTRO=[0.55,1.25,1.95,3.3]; /* 起動キャリブレーション拍 → 以後 +2.8s */
var STATIC_T=6.555;      /* 静止代表フレーム時刻: 定常拍スパイク直後 0.4s */
var TAU=6.28318530718;

/* ---------- 状態 ---------- */
var W=0,H=0,DPR=1,MOBILE=false,DIAG=0;
var t=0,prevT=0;
var beats=INTRO.slice(), fireIdx=0;
var baseY=0, baseTarget=0;
var pX=0,pY=0,pTX=0,pTY=0;          /* パララックス (-1..1, 平滑化) */
var pointerYpx=null, pointerSeenT=-99;
var flash=0, flashX=0, flashY=0, shake=0;
var rings=[], sparks=[], motes=[];
var bPaths=new Array(NB);

/* ---------- スプライト (放射グラデを事前焼き込み → drawImage のみ) ---------- */
function makeSprite(size,stops){
  var c=DOC.createElement('canvas');c.width=c.height=size;
  var g=c.getContext('2d');
  var gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(var i=0;i<stops.length;i++) gr.addColorStop(stops[i][0],stops[i][1]);
  g.fillStyle=gr;g.fillRect(0,0,size,size);
  return c;
}
var spGold =makeSprite(64,[[0,'rgba(244,241,234,1)'],[0.22,'rgba(200,146,46,0.9)'],[0.55,'rgba(200,146,46,0.28)'],[1,'rgba(200,146,46,0)']]);
var spAzure=makeSprite(64,[[0,'rgba(244,241,234,1)'],[0.25,'rgba(127,163,204,0.9)'],[0.6,'rgba(62,111,168,0.25)'],[1,'rgba(62,111,168,0)']]);
var spMote =makeSprite(32,[[0,'rgba(127,163,204,0.9)'],[0.5,'rgba(62,111,168,0.35)'],[1,'rgba(62,111,168,0)']]);

/* ---------- ヘルパ ---------- */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function gauss(u,c,s){var d=(u-c)/s;return Math.exp(-d*d);}
/* PQRST 波形 (正規化、R 頂点 ≈ 1) */
function ecgShape(u){
  if(u<-0.45||u>0.9) return 0;
  return 0.09*gauss(u,-0.22,0.05)
       - 0.14*gauss(u,0.012,0.013)
       + 1.00*gauss(u,R_T,0.017)
       - 0.24*gauss(u,0.105,0.016)
       + 0.17*gauss(u,0.36,0.075);
}
function signalAt(time){
  var v=0;
  for(var i=beats.length-1;i>=0;i--){
    var u=time-beats[i];
    if(u>0.9) break;      /* これより古い拍は全て範囲外 */
    if(u<-0.45) continue;
    v+=ecgShape(u);
  }
  return v;
}
function hum(time){ /* アナログ微振動 */
  return Math.sin(time*8.13)+0.6*Math.sin(time*13.7+1.3)+0.4*Math.sin(time*3.1);
}
function headXAt(time){
  return ((time%SWEEP)/SWEEP)*(W+60)-30;
}
function scheduleBeats(upTo){
  var last=beats[beats.length-1];
  while(last<upTo){ last+=PERIOD; beats.push(last); }
}

/* ---------- 心拍イベント ---------- */
function pushRings(x,y,t0){
  rings.push({x:x,y:y,t0:t0,d:0,   dur:1.5, maxR:DIAG*0.95,col:'rgb(127,163,204)',a:0.5, lw:16});
  rings.push({x:x,y:y,t0:t0,d:0.10,dur:1.1, maxR:DIAG*0.50,col:'rgb(200,146,46)', a:0.55,lw:6});
  rings.push({x:x,y:y,t0:t0,d:0,   dur:0.5, maxR:DIAG*0.16,col:'rgb(244,241,234)',a:0.9, lw:2.5});
}
function spawnSparks(x,y,n){
  for(var i=0;i<n;i++){
    var a=-Math.PI/2+(Math.random()-0.5)*Math.PI*1.7;
    var sp=90+Math.pow(Math.random(),1.8)*560;
    sparks.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*0.9,
      age:0,life:0.7+Math.random()*1.1,sz:5+Math.random()*8,
      gold:Math.random()<0.78,seed:Math.random()*7});
  }
  if(sparks.length>240) sparks.splice(0,sparks.length-240);
}
function igniteForBeat(i){
  if(STATIC_MODE) return;
  if(i<mainToks.length){
    mainToks[i].classList.add('lit');
  }else if(i===mainToks.length){
    subToks.forEach(function(el,j){setTimeout(function(){el.classList.add('lit');},j*120);});
    setTimeout(function(){ if(badge) badge.classList.add('lit'); },subToks.length*120+220);
  }else{
    title.classList.remove('pulse'); void title.offsetWidth; title.classList.add('pulse');
  }
}
function fireBeat(i){
  var bt=beats[i]+R_T;
  var x=headXAt(bt);
  var y=baseY-signalAt(bt)*AMP*H;
  flash=1; flashX=x; flashY=y; shake=1;
  pushRings(x,y,bt);
  spawnSparks(x,y,MOBILE?22:62);
  igniteForBeat(i);
}
function burst(x,y){ /* pointerdown: 手動除細動 */
  rings.push({x:x,y:y,t0:t,d:0,   dur:0.9,maxR:DIAG*0.35,col:'rgb(127,163,204)',a:0.45,lw:8});
  rings.push({x:x,y:y,t0:t,d:0.05,dur:0.6,maxR:DIAG*0.18,col:'rgb(200,146,46)', a:0.5, lw:3});
  spawnSparks(x,y,MOBILE?10:26);
  flash=Math.max(flash,0.38); flashX=x; flashY=y;
  shake=Math.max(shake,0.5);
}

/* ---------- 物理 ---------- */
function stepSparks(dt){
  for(var i=0;i<sparks.length;i++){
    var s=sparks[i];
    s.age+=dt;
    s.vy+=460*dt;
    var dr=Math.exp(-dt*1.5);
    s.vx*=dr; s.vy*=dr;
    s.x+=s.vx*dt; s.y+=s.vy*dt;
  }
  sparks=sparks.filter(function(s){return s.age<s.life;});
}
function stepMotes(dt){
  for(var i=0;i<motes.length;i++){
    var m=motes[i];
    m.x-=(3+m.z*9)*dt; m.y-=(1.2+m.z*4)*dt;
    if(m.x<-12)m.x=W+12; if(m.y<-12)m.y=H+12;
  }
}
function update(dt){
  prevT=t; t+=dt;
  scheduleBeats(t+1);
  pX+=(pTX-pX)*Math.min(1,dt*3.5);
  pY+=(pTY-pY)*Math.min(1,dt*3.5);
  var idle=(t-pointerSeenT)>3;
  baseTarget=(!idle&&pointerYpx!=null)?clamp(pointerYpx,H*0.52,H*0.80):H*0.68;
  baseY+=(baseTarget-baseY)*Math.min(1,dt*1.7);
  while(fireIdx<beats.length&&beats[fireIdx]+R_T<=t){ fireBeat(fireIdx); fireIdx++; }
  flash=Math.max(0,flash-dt/0.15);
  shake=Math.max(0,shake-dt*4.5);
  stepSparks(dt);
  rings=rings.filter(function(r){return t-r.t0-r.d<r.dur;});
  stepMotes(dt);
}

/* ---------- 描画 ---------- */
var TRACE_PASSES=[
  [15, 'rgb(127,163,204)', 0.05],
  [5.5,'rgb(62,111,168)',  0.32],
  [1.8,'rgb(244,241,234)', 0.90]
];
function drawTrace(){
  var i;
  for(i=0;i<NB;i++) bPaths[i]=null;
  var Wtot=W+60, speed=Wtot/SWEEP, hx=headXAt(t);
  var step=MOBILE?2:3;
  var run=null,runB=-1,prevX=0,prevY=0,hasPrev=false,prevAge=1e9;
  function flush(){
    if(run&&run.length>=4){ (bPaths[runB]||(bPaths[runB]=[])).push(run); }
    run=null; runB=-1;
  }
  for(var x=-30;x<=W+30;x+=step){
    var dist=hx-x; if(dist<0) dist+=Wtot;
    var age=dist/speed, tx=t-age;
    if(tx<0){ flush(); hasPrev=false; prevAge=1e9; continue; }
    var af=Math.exp(-K_DECAY*age);
    if(af<0.045){ flush(); hasPrev=false; prevAge=1e9; continue; }
    if(Math.abs(age-prevAge)>0.4){ flush(); hasPrev=false; }
    var y=baseY-signalAt(tx)*AMP*H+hum(tx)*1.4;
    var b=Math.min(NB-1,(af*NB)|0);
    if(b!==runB){ flush(); run=hasPrev?[prevX,prevY]:[]; runB=b; }
    run.push(x,y); prevX=x; prevY=y; hasPrev=true; prevAge=age;
  }
  flush();
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.globalCompositeOperation='lighter';
  for(var p=0;p<TRACE_PASSES.length;p++){
    ctx.lineWidth=TRACE_PASSES[p][0];
    ctx.strokeStyle=TRACE_PASSES[p][1];
    var pa=TRACE_PASSES[p][2];
    for(var bb=0;bb<NB;bb++){
      var runs=bPaths[bb]; if(!runs) continue;
      ctx.globalAlpha=pa*((bb+1)/NB);
      ctx.beginPath();
      for(i=0;i<runs.length;i++){
        var r=runs[i];
        ctx.moveTo(r[0],r[1]);
        for(var j=2;j<r.length;j+=2) ctx.lineTo(r[j],r[j+1]);
      }
      ctx.stroke();
    }
  }
  /* 最新区間のホットハロー */
  var hot=bPaths[NB-1];
  if(hot){
    ctx.globalAlpha=0.05; ctx.lineWidth=30; ctx.strokeStyle='rgb(127,163,204)';
    ctx.beginPath();
    for(i=0;i<hot.length;i++){
      var hr=hot[i];
      ctx.moveTo(hr[0],hr[1]);
      for(var k=2;k<hr.length;k+=2) ctx.lineTo(hr[k],hr[k+1]);
    }
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

/* 奥のパララックス波 (呼吸・脈波) */
var WAVES=[
  {y:0.13, amp:0.040,k:0.02, sp:1.6, par:0.45,lw:1.5,col:'rgba(127,163,204,0.10)',fn:0},
  {y:0.50, amp:0.055,k:0.006,sp:0.5, par:0.85,lw:1.2,col:'rgba(127,163,204,0.05)',fn:1},
  {y:0.865,amp:0.026,k:0.009,sp:0.75,par:0.28,lw:1.5,col:'rgba(127,163,204,0.13)',fn:2}
];
function waveFn(id,u){
  if(id===0){ /* SpO2 脈波 */
    var p=((u/TAU)%1+1)%1;
    return Math.exp(-Math.pow((p-0.2)/0.08,2))+0.45*Math.exp(-Math.pow((p-0.46)/0.11,2))-0.35;
  }
  if(id===1) return Math.sin(u)*0.6+Math.sin(u*0.53+1.4)*0.4; /* 呼吸 */
  return Math.sin(u*1.3)*0.5+Math.sin(u*0.31+0.5)*0.5;
}
function drawWaves(){
  var step=MOBILE?16:11;
  ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';
  for(var i=0;i<WAVES.length;i++){
    var wv=WAVES[i];
    var yb=H*wv.y+pY*wv.par*26;
    var xoff=pX*wv.par*70;
    ctx.beginPath();
    for(var x=-20;x<=W+20;x+=step){
      var u=(x+xoff)*wv.k-t*wv.sp;
      var y=yb+waveFn(wv.fn,u)*wv.amp*H;
      if(x===-20) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=wv.col; ctx.lineWidth=wv.lw; ctx.stroke();
  }
}
function drawMotes(){
  ctx.globalCompositeOperation='lighter';
  for(var i=0;i<motes.length;i++){
    var m=motes[i];
    var tw=0.5+0.5*Math.sin(t*1.6+m.s);
    ctx.globalAlpha=(0.05+0.20*tw)*(0.35+0.65*m.z);
    var sz=(4.5+m.z*7)*(1+tw*0.25);
    var ox=pX*(1-m.z)*34, oy=pY*(1-m.z)*24;
    ctx.drawImage(spMote,m.x+ox-sz/2,m.y+oy-sz/2,sz,sz);
  }
  ctx.globalAlpha=1;
}
function drawRings(){
  ctx.globalCompositeOperation='lighter';
  for(var i=0;i<rings.length;i++){
    var r=rings[i];
    var p=(t-r.t0-r.d)/r.dur;
    if(p<=0||p>=1) continue;
    var e=1-Math.pow(1-p,3);
    ctx.globalAlpha=Math.pow(1-p,2)*r.a;
    ctx.strokeStyle=r.col;
    ctx.lineWidth=r.lw*(1-p)+0.6;
    ctx.beginPath();
    ctx.arc(r.x,r.y,Math.max(1,e*r.maxR),0,TAU);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawSparks(){
  ctx.globalCompositeOperation='lighter';
  for(var i=0;i<sparks.length;i++){
    var s=sparks[i];
    var p=s.age/s.life;
    var tw=0.72+0.28*Math.sin(t*36+s.seed*9);
    ctx.globalAlpha=Math.max(0,Math.pow(1-p,1.25))*tw;
    var sz=s.sz*(1.7-p);
    ctx.drawImage(s.gold?spGold:spAzure,s.x-sz/2,s.y-sz/2,sz,sz);
  }
  ctx.globalAlpha=1;
}
function drawHead(){
  var sig=signalAt(t);
  var hx=headXAt(t), hy=baseY-sig*AMP*H+hum(t)*1.4;
  var boost=Math.min(1,Math.abs(sig)*1.5);
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=0.9;
  var hs=30+boost*130;
  ctx.drawImage(spAzure,hx-hs/2,hy-hs/2,hs,hs);
  ctx.globalAlpha=1;
  hs=12+boost*16;
  ctx.drawImage(spAzure,hx-hs/2,hy-hs/2,hs,hs);
  ctx.fillStyle='rgba(244,241,234,.95)';
  ctx.beginPath(); ctx.arc(hx,hy,1.8+boost*1.6,0,TAU); ctx.fill();
}
function drawFlash(){
  if(flash<=0.004) return;
  var f=flash*flash;
  var g=ctx.createRadialGradient(flashX,flashY,0,flashX,flashY,DIAG*0.8);
  g.addColorStop(0,   'rgba(244,241,234,'+(0.30*f).toFixed(4)+')');
  g.addColorStop(0.22,'rgba(200,146,46,'+(0.10*f).toFixed(4)+')');
  g.addColorStop(0.55,'rgba(127,163,204,'+(0.08*f).toFixed(4)+')');
  g.addColorStop(1,   'rgba(127,163,204,0)');
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.clearRect(0,0,W,H);
  /* 心拍衝撃の微小カメラシェイク (canvas のみ、文字は不動) */
  if(shake>0.01){
    ctx.translate((Math.random()-0.5)*shake*shake*6,(Math.random()-0.5)*shake*shake*4);
  }
  drawWaves();
  drawMotes();
  drawTrace();
  drawRings();
  drawSparks();
  drawHead();
  drawFlash();
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  if(!STATIC_MODE&&grid){
    grid.style.transform='translate3d('+(pX*-12).toFixed(2)+'px,'+(pY*-9).toFixed(2)+'px,0)';
  }
}

/* ---------- 静止代表フレーム (?static=1 / reduced-motion) ----------
   定常拍スパイク 0.4s 後: フル残光トレース + 衝撃波リング + 飛散スパーク
   + フラッシュ + 全文字点灯。rAF なしの同期一発描画。 */
function buildStaticScene(){
  beats=INTRO.slice(); rings=[]; sparks=[];
  t=STATIC_T; prevT=t;
  scheduleBeats(t);
  baseY=baseTarget=H*0.68; pX=pY=0;
  var bi=-1;
  for(var i=0;i<beats.length;i++) if(beats[i]+R_T<=t) bi=i;
  var bt=beats[bi]+R_T;
  var x=headXAt(bt), y=baseY-signalAt(bt)*AMP*H;
  pushRings(x,y,bt);
  spawnSparks(x,y,MOBILE?22:62);
  var age=t-bt, n=Math.max(1,Math.round(age*60));
  for(var s=0;s<n;s++) stepSparks(age/n);
  flash=0.5; flashX=x; flashY=y; shake=0;
  draw();
}

/* ---------- セットアップ ---------- */
function buildMotes(){
  var n=Math.min(150,Math.max(24,Math.round(W*H/11000*(MOBILE?0.34:1))));
  motes=[];
  for(var i=0;i<n;i++){
    motes.push({x:Math.random()*W,y:Math.random()*H,z:0.25+Math.random()*0.75,s:Math.random()*TAU});
  }
}
function resize(){
  var r=hero.getBoundingClientRect();
  W=Math.max(320,Math.round(r.width));
  H=Math.max(420,Math.round(r.height));
  DPR=Math.min(2,window.devicePixelRatio||1); /* DPR 上限 2 */
  MOBILE=W<768;
  DIAG=Math.hypot(W,H);
  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);
  buildMotes();
  baseY=baseTarget=H*0.68;
  if(STATIC_MODE) buildStaticScene();
}

/* ---------- ループ (document.hidden で rAF 停止) ---------- */
var raf=0,last=0,running=false;
function frame(now){
  raf=requestAnimationFrame(frame);
  var dt=(now-last)/1000; last=now;
  if(!(dt>0)) dt=0.016;
  if(dt>0.05) dt=0.05;
  update(dt);
  draw();
}
function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(frame); }
function stop(){ running=false; cancelAnimationFrame(raf); }

/* ---------- 入力 ---------- */
window.addEventListener('pointermove',function(e){
  if(STATIC_MODE) return;
  pointerYpx=e.clientY;
  pTX=(e.clientX/W-0.5)*2;
  pTY=(e.clientY/H-0.5)*2;
  pointerSeenT=t;
},{passive:true});
window.addEventListener('pointerdown',function(e){
  if(STATIC_MODE) return;
  burst(e.clientX,e.clientY);
},{passive:true});
DOC.addEventListener('visibilitychange',function(){
  if(STATIC_MODE) return;
  if(DOC.hidden) stop(); else start();
});
var rTm=0;
window.addEventListener('resize',function(){
  clearTimeout(rTm);
  rTm=setTimeout(resize,140);
});

/* ---------- 起動 ---------- */
if(STATIC_MODE){
  ROOT.classList.add('lit-all');   /* 全文字点灯状態 (base CSS のまま可視) */
  resize();                        /* → buildStaticScene() 同期描画 */
}else{
  ROOT.classList.add('anim');      /* ここで初めて暗転スタートに切替 */
  resize();
  start();
  /* 安全弁: 何があっても 7 秒後には全点灯 */
  setTimeout(function(){
    mainToks.concat(subToks).forEach(function(el){el.classList.add('lit');});
    if(badge) badge.classList.add('lit');
  },7000);
}
})();
</script>
</body>
</html>
