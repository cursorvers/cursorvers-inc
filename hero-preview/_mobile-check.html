<!DOCTYPE html>
<!-- 検証専用: 390x844 iframe でモバイルレイアウトを再現 -->
<html lang="ja">
<head><meta charset="UTF-8"><title>mobile check 390px</title>
<style>
  body { margin:0; background:#333; display:flex; align-items:center; justify-content:center; min-height:100vh; gap:24px; }
  iframe { width:390px; height:844px; border:2px solid #666; border-radius:12px; }
  .lbl { color:#aaa; font:12px monospace; text-align:center; margin-top:6px; }
</style></head>
<body>
  <div>
    <iframe src="../index.html?static=1"></iframe>
    <p class="lbl">index.html ?static=1 @390x844</p>
  </div>
  <div>
    <iframe src="../index.html"></iframe>
    <p class="lbl">index.html live @390x844</p>
  </div>
</body>
</html>
