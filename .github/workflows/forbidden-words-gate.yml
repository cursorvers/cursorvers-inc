name: Forbidden Words Gate

on:
  pull_request:
    paths:
      - index.html
      - services.html
      - gov-lead.html
      - contact.html
      - news/**/*.html
  push:
    branches:
      - main
    paths:
      - index.html
      - services.html
      - gov-lead.html
      - contact.html
      - news/**/*.html
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan forbidden marketing words
        shell: bash
        run: |
          set -euo pipefail

          targets=(
            "index.html"
            "services.html"
            "gov-lead.html"
            "contact.html"
          )

          if [ -d news ]; then
            while IFS= read -r -d '' file; do
              targets+=("$file")
            done < <(find news -type f -name '*.html' -print0)
          fi

          patterns=(
            "断罪"
            "裁く"
            "違反"
            "告発"
            "暴く"
            "本監査"
            "運用後監査"
            "年次監査"
            "監査レビュー"
            "監査観点"
            "監査範囲"
            "監査報告"
            "監査準備"
            "監査スケジュール"
            "監査の流れ"
          )

          existing_targets=()
          for file in "${targets[@]}"; do
            if [ -f "$file" ]; then
              existing_targets+=("$file")
            fi
          done

          if [ "${#existing_targets[@]}" -eq 0 ]; then
            echo "OK: no forbidden words detected."
            exit 0
          fi

          failed=0
          for pattern in "${patterns[@]}"; do
            if grep -F -n -- "$pattern" "${existing_targets[@]}"; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::Forbidden marketing wording detected. Do not use the listed marketing phrases. Standalone 監査 is allowed in CLASS B technical/legal contexts such as 監査ログ, 税務監査, 法定監査, セキュリティ監査."
            exit 1
          fi

          echo "OK: no forbidden words detected."
