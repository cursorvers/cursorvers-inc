name: Turnstile Guard
on:
  pull_request:
    paths:
      - 'contact.html'
      - 'scripts/inject-turnstile-sitekey.mjs'
      - 'scripts/inject-turnstile-sitekey.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/turnstile-guard.yml'

permissions:
  contents: read

jobs:
  turnstile-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # deploy はしない。鍵の検査そのものを、架空の鍵と実際の contact.html で試す
      - name: Test the Turnstile guard
        run: npm run test:turnstile-guard
