name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.set-build-id.outputs.build_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Set Build ID
        id: set-build-id
        run: |
          BUILD_ID="${GITHUB_SHA::7}"
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Inject Build ID
        run: npm run build:id

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          # Copy only necessary files for deployment
          cp -r *.html dist/ assets/ CNAME _site/ 2>/dev/null || true
          cp -r news/ _site/ 2>/dev/null || true
          cp -r images/ _site/ 2>/dev/null || true
          cp -r css/ _site/ 2>/dev/null || true
          cp *.jpeg *.jpg *.png *.webp *.ico _site/ 2>/dev/null || true
          # SEO files (GitHub Pages はルート配信していたが Cloudflare は明示コピーが必要)
          cp robots.txt sitemap.xml _site/ 2>/dev/null || true
          # PWA files
          cp manifest.json sw.js cursorvers-icon.svg .nojekyll _site/ 2>/dev/null || true
          cp -r icons/ _site/ 2>/dev/null || true
          cp -r brochures/ _site/ 2>/dev/null || true
          cp *.mp4 _site/ 2>/dev/null || true
          # Cloudflare Pages の1ファイル25MiB制限対策: hero_library.mp4 を除外
          rm -f _site/hero_library.mp4
          # Cloudflare Pages 設定ファイル
          cp _headers _redirects _site/ 2>/dev/null || true

      - name: Inject Turnstile sitekey
        if: vars.TURNSTILE_SITE_KEY != ''
        run: python3 -c 'import os, pathlib; p = pathlib.Path("_site/contact.html"); p.write_text(p.read_text().replace("TURNSTILE_SITE_KEY_PLACEHOLDER", os.environ["SITE_KEY"]))'
        env:
          SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=cursorvers-inc

  smoke-test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Wait for CDN propagation
        run: sleep 30

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Run smoke tests against production
        run: npx playwright test --retries=2
        env:
          BUILD_ID: ${{ needs.build.outputs.build_id }}
          BASE_URL: https://cursorvers.com/
