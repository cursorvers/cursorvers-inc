name: Lighthouse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: |
          lhci autorun --collect.url=https://cursorvers.com/ \
                       --collect.url=https://cursorvers.com/services.html \
                       --collect.url=https://cursorvers.com/gov-lead.html \
                       --collect.url=https://cursorvers.com/consulting.html \
                       --assert.assertions.categories:performance="off" \
                       --assert.assertions.categories:accessibility="warn,minScore,0.9" \
                       --assert.assertions.categories:best-practices="off" \
                       --assert.assertions.categories:seo="warn,minScore,0.9" \
                       --upload.target=temporary-public-storage

      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30
