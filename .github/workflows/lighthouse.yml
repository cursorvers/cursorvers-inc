name: Lighthouse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: |
          lhci autorun --collect.url=https://cursorvers.com/ \
                       --collect.url=https://cursorvers.com/services.html \
                       --collect.url=https://cursorvers.com/gov-lead.html \
                       --collect.url=https://cursorvers.com/consulting.html \
                       --assert.preset=lighthouse:recommended \
                       --assert.assertions.categories:performance=warn \
                       --assert.assertions.categories:accessibility=error \
                       --assert.assertions.categories:best-practices=warn \
                       --assert.assertions.categories:seo=error \
                       --upload.target=temporary-public-storage

      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30
